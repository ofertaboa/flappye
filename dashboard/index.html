<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="flappy-build" content="auto">
  <script>!function(){try{var h=location.hostname;if("localhost"===h||"127.0.0.1"===h)return;var p=decodeURIComponent(location.pathname);if(/^\/flappy(?:%20| )game(\/|$)/i.test(p))location.replace(location.origin+(p.replace(/^\/flappy(?:%20| )game/i,"")||"/")+location.search+location.hash)}catch(e){}}();</script>
  <script src="/flappye/platform/js/shared/boot-redirect.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Flappy Copa — sua área de jogo. Veja saldo, aposte e inicie partidas valendo dinheiro real.">
  <meta name="theme-color" content="#0a4d32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Dashboard — Flappy Copa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="platform/css/tokens.css">
  <link rel="stylesheet" href="platform/css/landing.css">
  <link rel="stylesheet" href="platform/css/dashboard.css">
  <link rel="stylesheet" href="platform/css/dashboard-modals.css">
</head>
<body class="landing-page dashboard-page">
  <div id="app">
    <section class="dash-carousel dash-carousel--static" aria-label="Promoções" style="max-width:1120px;margin:5rem auto 1rem;padding:0 0.625rem">
      <div class="dash-carousel__viewport">
        <img class="dash-carousel__img" src="assets/banners/deposito-minimo.png" alt="Depósito mínimo" style="width:100%;border-radius:18px;display:block">
      </div>
    </section>
  </div>
  <script src="platform/js/vendor/qrcode-generator.js"></script>
  <script type="module" src="platform/js/dashboard/main.js"></script>
</body>
</html>
