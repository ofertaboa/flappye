# Netlify — Flappy Copo (site 100% estatico: HTML/JS/CSS/imagens locais)
# Antes de publicar no Netlify/Cloudflare rode:  node tools\setup.js --root
# (o GitHub Pages usa a base /flappye, que e o padrao de tools\base.js)
#
# Publique arrastando a pasta em app.netlify.com ou conectando o repositorio.

[build]
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Todas as rotas ja existem como arquivo estatico real:
#   /                 -> index.html
#   /login            -> login/index.html
#   /register         -> register/index.html
#   /dashboard        -> dashboard/index.html
#   /admin            -> admin/index.html
#   /admin-login      -> admin-login/index.html
#   /manager          -> manager/index.html
#   /manager-login    -> manager-login/index.html
#   /manager-register -> manager-register/index.html
#   /game             -> game/index.html
# Qualquer outra rota cai no 404.html (servido automaticamente).
