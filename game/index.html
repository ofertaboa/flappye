<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="flappy-build" content="auto">
  <script>!function(){try{var h=location.hostname;if("localhost"===h||"127.0.0.1"===h)return;var p=decodeURIComponent(location.pathname);if(/^\/flappy(?:%20| )game(\/|$)/i.test(p))location.replace(location.origin+(p.replace(/^\/flappy(?:%20| )game/i,"")||"/")+location.search+location.hash)}catch(e){}}();</script>
  <script src="/flappye/platform/js/shared/boot-redirect.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#3d9be0">
  <title>Flappy Pay — Jogar</title>
  <script>(function(){try{if(matchMedia('(pointer:coarse),(max-width:900px)').matches||navigator.maxTouchPoints>0){document.documentElement.classList.add('is-mobile-device');}}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,600;0,9..40,700&family=Fredoka:wght@500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="platform/css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-viewport">
    <aside class="desktop-panel desktop-panel-left" aria-hidden="true"></aside>
    <div id="game-stage">
      <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
      </div>
      <div id="input-layer" aria-hidden="true"></div>
      <div id="ui-root"></div>
    </div>
    <aside class="desktop-panel desktop-panel-right" aria-hidden="true"></aside>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
