<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="flappy-build" content="auto">
  <script>!function(){try{var h=location.hostname;if("localhost"===h||"127.0.0.1"===h)return;var p=decodeURIComponent(location.pathname);if(/^\/flappy(?:%20| )game(\/|$)/i.test(p))location.replace(location.origin+(p.replace(/^\/flappy(?:%20| )game/i,"")||"/")+location.search+location.hash)}catch(e){}}();</script>
  <script src="/flappye/platform/js/shared/boot-redirect.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b12">
  <title>Admin — Flappy Copa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="platform/css/tokens.css">
  <link rel="stylesheet" href="platform/admin/css/admin.css">
</head>
<body class="admin-login-page">
  <div class="admin-login">
    <div class="admin-login__card">
      <img class="admin-login__logo" src="assets/logo-header.png" alt="Flappy Copa" width="140" height="46">
      <h1 class="admin-login__title">Painel Administrativo</h1>
      <p class="admin-login__sub">Acesso restrito — Flappy Copa</p>
      <form id="admin-login-form" class="admin-login__form" novalidate>
        <label class="admin-field">
          <span class="admin-field__label">Usuário</span>
          <input class="admin-input" type="text" name="username" autocomplete="username" required>
        </label>
        <label class="admin-field">
          <span class="admin-field__label">Senha</span>
          <input class="admin-input" type="password" name="password" autocomplete="current-password" required>
        </label>
        <p id="admin-login-error" class="admin-alert admin-alert--error" hidden></p>
        <button class="admin-btn admin-btn--primary admin-btn--full" type="submit">Entrar</button>
      </form>
    </div>
  </div>
  <script type="module" src="platform/admin/js/login.js"></script>
</body>
</html>
